# /etc/nginx/sites-available/<DOMAIN>  (replace <DOMAIN>, then: certbot --nginx -d <DOMAIN>)
server {
    listen 80;
    server_name <DOMAIN>;

    # Receipt photos are uploaded through here.
    client_max_body_size 13m; # app limit is 12 MB plus multipart overhead

    location / {
        proxy_pass http://127.0.0.1:3232;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live sync (Server-Sent Events) must not be buffered or cut after 60 s.
    location = /api/events {
        proxy_pass http://127.0.0.1:3232;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
